<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · FishID</title>
<link rel="icon" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F6F4EF; --surface: #FFFFFF; --alt: #EFECE4; --ink: #111111; --muted: #5C5A55; --line: #E6E1D6; --primary: #111111; --on-primary: #FFFFFF; --accent: #0E6E7E; --accent-soft: #DCEFF0; --danger: #C8423B; --shadow: 0 18px 60px rgba(17,17,17,.10); color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0B1020; --surface: #151B2E; --alt: #1D2540; --ink: #F2F3F8; --muted: #A6ACC0; --line: #27304D; --primary: #F2F3F8; --on-primary: #0B1020; --accent: #62CBD8; --accent-soft: #163542; --danger: #FF7D74; --shadow: 0 18px 60px rgba(0,0,0,.45); color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font: 16px/1.5 "Hind Madurai", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased;
    background: radial-gradient(900px 500px at 50% -10%, var(--accent-soft), transparent 70%), var(--bg); }
  main { width: min(400px, 100%); background: var(--surface); border-radius: 32px; padding: 36px 30px 30px; box-shadow: var(--shadow); text-align: center; animation: rise .5s cubic-bezier(.2,.8,.2,1); }
  img { width: 72px; height: 72px; border-radius: 22px; box-shadow: 0 10px 30px rgba(14,110,126,.35); }
  h1 { margin: 18px 0 2px; font-size: 28px; line-height: 1.2; letter-spacing: -.01em; }
  p { margin: 0 0 26px; color: var(--muted); }
  label { display: block; text-align: left; font-size: 14px; font-weight: 600; color: var(--muted); margin: 0 0 8px 4px; }
  input { width: 100%; font: inherit; color: var(--ink); background: var(--alt); border: 1.5px solid transparent; border-radius: 16px; padding: 14px 16px; outline: none; transition: border-color .15s, background .15s; }
  input:focus { border-color: var(--ink); background: var(--surface); }
  button { width: 100%; margin-top: 16px; min-height: 56px; border: 0; border-radius: 999px; background: var(--primary); color: var(--on-primary); font: 600 18px "Hind Madurai", system-ui, sans-serif; cursor: pointer; transition: transform .12s; }
  button:active { transform: scale(.97); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .err { display: none; margin: 14px 0 0; color: var(--danger); font-weight: 600; font-size: 14px; }
  .wrong .err { display: block; }
  .wrong input { border-color: var(--danger); }
  footer { margin-top: 22px; font-size: 13px; color: var(--muted); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @media (prefers-reduced-motion: reduce) { main { animation: none; } }
</style>
</head>
<body>
<main>
  <img src="/logo.svg" alt="">
  <h1>FishID Studio</h1>
  <p>Edit species details and prices for the app.</p>
  <form method="post" action="/login">
    <label for="pw">Team password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <div class="err" role="alert">That password didn't work. Try again.</div>
    <button>Sign in</button>
  </form>
  <footer>Ask the project lead if you don't have the password.</footer>
</main>
<script>if (location.search.includes('wrong')) document.body.classList.add('wrong');</script>
</body>
</html>
