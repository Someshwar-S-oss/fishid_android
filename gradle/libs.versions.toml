espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
appcompat = "1.8.0"
kotlin = "2.2.10"
kotlinxSerialization = "1.9.0"
composeBom = "2026.02.01"
camerax = "1.6.2"
litert = "1.4.2"
