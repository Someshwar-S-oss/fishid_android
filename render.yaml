# Render blueprint for the admin site (admin/). Free plan sleeps after 15 idle minutes; only admins wait for the
# ~1 minute wake-up, because phones download catalog.json from GitHub, not from here.
services:
  - type: web
    name: fishid-admin
    runtime: node
    plan: free
    rootDir: admin
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /health
    buildFilter:
      paths: ["admin/**", "app/src/main/assets/data/**", "i18n/**"]
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
